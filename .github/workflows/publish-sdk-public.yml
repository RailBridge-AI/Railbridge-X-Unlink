name: Publish Public SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/server-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install package dependencies
        run: npm install

      - name: Run SDK tests
        run: npm test

      - name: Show publish contents
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
