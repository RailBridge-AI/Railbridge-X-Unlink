name: Publish Public SDK

on:
  push:
    tags:
      - "sdk-v*"
  workflow_dispatch:

jobs:
  publish-sdk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/server-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install package dependencies
        run: npm install

      - name: Run SDK tests
        run: npm test

      - name: Show publish contents
        run: npm pack --dry-run

      - name: Publish public package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Deprecate 0.1.0
        if: github.ref_name == 'sdk-v0.1.1'
        run: npm deprecate @railbridgeai/merchant-sdk@0.1.0 "Pulls in heavy @x402/paywall browser wallet dependencies; upgrade to 0.1.1 or later."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
