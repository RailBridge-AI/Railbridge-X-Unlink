<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Merchant OS Frontend Moved</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
      }

      .card {
        max-width: 680px;
        border: 1px solid #334155;
        border-radius: 16px;
        padding: 20px;
        background: #111827;
      }

      code {
        background: #1e293b;
        padding: 2px 6px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Merchant OS Frontend moved to Next.js</h1>
      <p>
        Run the frontend from <code>merchant-os/frontend</code> and open <code>http://localhost:3000</code>.
      </p>
      <p>
        The API server still runs on <code>http://localhost:4030</code> and now redirects browser routes to the
        frontend URL.
      </p>
    </div>
  </body>
</html>
